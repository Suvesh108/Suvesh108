<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 130" width="100%" height="100%">
  
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer metallic border and obsidian background -->
  <rect width="976" height="126" x="2" y="2" fill="#090A0F" rx="8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6" filter="url(#goldGlow)" />
  <rect width="976" height="126" x="2" y="2" fill="#090A0F" rx="8" stroke="#1F2433" stroke-width="1" />
  
  <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#D4AF37" letter-spacing="1.5">HONORS &amp; ACHIEVEMENTS</text>
  
  
    <!-- Badge 1 -->
    <g transform="translate(20, 45)">
      <!-- Pill Container with luxury metallic border -->
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" filter="url(#goldGlow)" />
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#23283B" stroke-width="1" />
      <text x="18" y="38" font-size="18" fill="#D4AF37">✦</text>
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Code Specialist</text>
      <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">486+ Commits</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(258, 45)">
      <!-- Pill Container with luxury metallic border -->
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" filter="url(#goldGlow)" />
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#23283B" stroke-width="1" />
      <text x="18" y="38" font-size="18" fill="#D4AF37">★</text>
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Star Collector</text>
      <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">18 Stars</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(496, 45)">
      <!-- Pill Container with luxury metallic border -->
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" filter="url(#goldGlow)" />
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#23283B" stroke-width="1" />
      <text x="18" y="38" font-size="18" fill="#D4AF37">◈</text>
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Community Leader</text>
      <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">15 Followers</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(734, 45)">
      <!-- Pill Container with luxury metallic border -->
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" filter="url(#goldGlow)" />
      <rect width="222" height="60" fill="#141721" rx="8" stroke="#23283B" stroke-width="1" />
      <text x="18" y="38" font-size="18" fill="#D4AF37">⬡</text>
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Creator</text>
      <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Deploying Code</text>
    </g>
</svg>