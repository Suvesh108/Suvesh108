name: Generate 3D Isometric Skyline and Stats Cards

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate 3D Profile Contrib
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Theme 3D Skyline (Obsidian & Champagne Gold)
        run: |
          node scripts/theme-3d-svg.js profile-3d-contrib/profile-night-view.svg

      - name: Generate GitHub Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-stats.js ${{ github.repository_owner }}

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/ github-stats.svg top-languages.svg github-achievements.svg
          if ! git diff --quiet --cached; then
            git commit -m "⚡ Generated 3D Isometric Skyline and Stats Cards"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to skyline or stats. Skipping push."
          fi
