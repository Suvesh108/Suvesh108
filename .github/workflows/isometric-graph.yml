name: Generate GitHub Skyline ASCII and Stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate GitHub Skyline ASCII and Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-skyline-ascii.js ${{ github.repository_owner }}
          node scripts/generate-stats.js ${{ github.repository_owner }}

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skyline-ascii.svg skyline-ascii.txt github-stats.svg top-languages.svg github-achievements.svg
          if ! git diff --quiet --cached; then
            git commit -m "⚡ Generated GitHub Skyline ASCII and Stats Cards"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to skyline ASCII or stats. Skipping push."
          fi
