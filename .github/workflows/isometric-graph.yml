name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate GitHub Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-stats.js ${{ github.repository_owner }}

      - name: Sync Recent Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-releases.js ${{ github.repository_owner }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-languages.svg github-achievements.svg README.md index.html
          if ! git diff --quiet --cached; then
            git commit -m "⚡ Update GitHub stats cards & sync latest releases"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to stats or releases. Skipping push."
          fi
