name: Update Recent Releases and Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-activity.yml'
      - 'scripts/update-releases.js'

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Live Releases in README and Companion App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-releases.js ${{ github.repository_owner }}

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md index.html
          if ! git diff --quiet --cached; then
            git commit -m "⚡ Sync latest releases from GitHub activity"
            git pull --rebase origin main
            git push origin main
          else
            echo "Releases are already up to date. Skipping push."
          fi
